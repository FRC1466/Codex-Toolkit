name: FRC toolkit checks
on:
  push:
    paths: ['tools/frc/**', '.agents/skills/**', 'templates/**', 'docs/**', '*.md', 'toolkit-manifest.json', 'frc-toolkit.json', '.github/workflows/toolkit.yml']
  pull_request:
    paths: ['tools/frc/**', '.agents/skills/**', 'templates/**', 'docs/**', '*.md', 'toolkit-manifest.json', 'frc-toolkit.json', '.github/workflows/toolkit.yml']
permissions:
  contents: read
jobs:
  toolkit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test toolkit utilities
        run: python -m unittest discover -s tools/frc/tests -v
